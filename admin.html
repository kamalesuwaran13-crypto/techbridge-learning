<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10213f"><title>Admin Portal | TechBridge Learning</title>
<style>
:root{--navy:#10213f;--blue:#2864dc;--ink:#18243a;--muted:#68758b;--line:#e5eaf2;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,Arial}header{background:var(--navy);color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header a{color:white;text-decoration:none;font-weight:800}.wrap{width:min(1050px,calc(100% - 30px));margin:28px auto}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}h1{font-size:27px;margin:0 0 5px}h2{font-size:19px;margin:0 0 12px}.muted{color:var(--muted)}input,textarea{width:100%;padding:11px;border:1px solid #d7dfeb;border-radius:9px;font:inherit}label{display:block;font-size:12px;font-weight:750;color:#53617a;margin:12px 0 5px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:9px;background:var(--blue);color:white;padding:10px 14px;font-weight:750;cursor:pointer}button.reject{background:#a83a45}button.secondary{background:#eef2f8;color:#30415e}.notice{padding:11px 13px;border-radius:9px;background:#eef4ff;color:#234a91;font-size:13px;margin:12px 0}.error{background:#fff0f0;color:#9b2932}.success{background:#edf9f1;color:#21683b}.request{border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.request h3{margin:0 0 5px;font-size:16px}.request p{margin:4px 0;color:var(--muted);font-size:13px}.request textarea{margin:8px 0;min-height:65px}.hidden{display:none!important}.pill{font-size:11px;padding:4px 8px;border-radius:20px;background:#eef2f8;color:#53617a}@media(max-width:600px){.card{padding:17px}}
</style></head><body>
<header><a href="index.html">TECHBRIDGE LEARNING · ADMIN</a><div class="row"><a href="student.html" style="color:white">Student portal</a><button id="logout" class="secondary hidden">Sign out</button></div></header>
<main class="wrap"><section class="card"><h1>Certificate request management</h1><p class="muted">Review student details and approve or reject TechBridge certificate requests.</p><div id="status" class="notice">Connecting…</div></section>
<section class="card" id="authCard"><h2>Admin sign in</h2><label for="email">Admin email</label><input id="email" type="email" autocomplete="username"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"><button id="login" style="margin-top:14px">Sign in</button><p class="muted" style="font-size:12px">Only accounts listed in the Supabase admin_users table have admin access.</p></section>
<section class="card hidden" id="dashboard"><h2>Certificate requests</h2><div id="requests"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let sb,currentUser;const $=id=>document.getElementById(id);function msg(t,type=""){$("status").textContent=t;$("status").className="notice "+type}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showAuth(){$("authCard").classList.remove("hidden");$("dashboard").classList.add("hidden");$("logout").classList.add("hidden")}
async function init(){try{const cfg=await fetch("/api/config",{cache:"no-store"}).then(r=>r.json());if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw Error(cfg.error||"Backend is not configured.");sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const {data:{session}}=await sb.auth.getSession();if(session){currentUser=session.user;await showDashboard()}else msg("Sign in with the administrator account.");sb.auth.onAuthStateChange(async(_e,s)=>{currentUser=s?.user||null;if(currentUser)await showDashboard();else showAuth()})}catch(e){msg(e.message,"error")}}
async function showDashboard(){const {data:admin,error}=await sb.from("admin_users").select("user_id").eq("user_id",currentUser.id).maybeSingle();if(error||!admin){msg("This account does not have administrator permission.","error");await sb.auth.signOut();return}$("authCard").classList.add("hidden");$("dashboard").classList.remove("hidden");$("logout").classList.remove("hidden");msg("Administrator access confirmed.","success");await loadRequests()}
async function loadRequests(){const {data,error}=await sb.from("certificate_requests").select("id,learner_name,email,college_name,status,created_at,courses(title)").order("created_at",{ascending:false});if(error){$("requests").textContent=error.message;return}if(!data?.length){$("requests").innerHTML='<p class="muted">No certificate requests yet.</p>';return}$("requests").innerHTML=data.map(r=>'<article class="request"><div class="row" style="justify-content:space-between"><h3>'+esc(r.learner_name)+'</h3><span class="pill">'+esc(r.status)+'</span></div><p><b>Course:</b> '+esc(r.courses?.title||"Unknown course")+'</p><p><b>Email:</b> '+esc(r.email)+'</p><p><b>College:</b> '+esc(r.college_name||"Not provided")+'</p><p><b>Submitted:</b> '+new Date(r.created_at).toLocaleString()+'</p>'+(r.status==="pending"?'<label>Admin note (optional)</label><textarea id="note-'+r.id+'" maxlength="1000" placeholder="Review note"></textarea><div class="row"><button data-review="yes" data-id="'+r.id+'">Approve & issue certificate</button><button class="reject" data-review="no" data-id="'+r.id+'">Reject request</button></div>':'')+'</article>').join("");$("requests").querySelectorAll("[data-review]").forEach(b=>b.addEventListener("click",()=>review(b.dataset.id,b.dataset.review==="yes")))}
async function review(id,approve){const note=$("note-"+id)?.value||"";if(!confirm(approve?"Approve and issue a TechBridge certificate?":"Reject this request?"))return;const {data,error}=await sb.rpc("review_techbridge_certificate_request",{p_request_id:id,p_approve:approve,p_admin_notes:note});if(error)msg(error.message,"error");else msg(approve?"Approved. Certificate ID: "+data:"Request rejected.","success");await loadRequests()}
$("login").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)msg(error.message,"error")};$("logout").onclick=async()=>{await sb.auth.signOut();showAuth();msg("Signed out.")};init();
</script></body></html>
